---
global:
  temp_dir: work
  nf_config: test/global.config
  remove_temp: false
  clean_logs: true

cases:
  - name: test-integration-MAD-PhysicalReference
    message: Integration test using MSPtools MAD normalization with a physical reference
    nf_script: main.nf
    nf_config: test/test_integration_MAD_PhysicalReference/test.config
    skip: false
    verbose: true

  - name: test-integration-VirtualReference
    message: Integration test using virtual reference
    nf_script: main.nf
    nf_config: test/test_integration_VirtualReference/test.config
    skip: false
    verbose: true

  - name: test-integration-mergedConsensusXML
    message: Integration test using merged consensusXML as entrypoint
    nf_script: main.nf
    nf_config: test/test_integration_mergedConsensusXML/test.config
    skip: false
    verbose: true

  - name: test-integration-FeatureBasedTMT
    message: Integration test of cross-plex MS1 feature-based TMT channel-area estimation
    nf_script: main.nf
    nf_config: test/test_integration_FeatureBasedTMT/test.config
    skip: false
    verbose: true
