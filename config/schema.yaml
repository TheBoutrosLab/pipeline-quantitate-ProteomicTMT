output_dir:
  type: Path
  mode: w
  required: true
  help: Root output directory.
dataset_id:
  type: String
  required: true
  help: Dataset identifier used in final filenames; letters, digits, dots, underscores, and hyphens only.
mzML_csv:
  type: Path
  mode: r
  required: false
  help: mzML files for one or more TMT plexes.
channel_csv:
  type: Path
  mode: r
  required: false
  help: Reporter channels and sample descriptions keyed by plex_id for mzML input.
plex_type:
  type: String
  required: false
  help: OpenMS reporter type shared by all plexes in an mzML run.
consensusXML_csv:
  type: Path
  mode: r
  required: false
  help: One premerged consensusXML file per TMT plex.
tmt_workflow:
  type: String
  required: false
  help: Select scan_based (reporter-ion peptide quantification) or feature_based (MS1 feature-based TMT quantification).
consensusXML_entrypoint:
  type: Bool
  required: false
  help: Use consensusXML_csv instead of mzML_csv when true.
idXML_csv:
  type: Path
  mode: r
  required: true
  help: One matching idXML file per plex.
protein_quantifier_best_charge_and_fraction:
  type: Bool
  required: false
  help: Report peptide abundance separately by fraction and charge state.
tmt_normalization_method:
  type: String
  required: false
  help: Normalization method, either mad or openms.
virtual_reference_min_channels:
  type: Integer
  required: false
  help: Minimum number of finite channels above min_int for each feature and plex virtual reference.
mad_normalizer_quasi_intensity:
  type: Bool
  required: false
  help: Write MAD-normalized reference-scaled quasi-intensities instead of log2 ratios.
mad_normalizer_bridge_scale:
  type: Bool
  required: false
  help: Align feature-based plexes by the median of all valid reference areas.
mad_normalizer_allow_virtual_bridge:
  type: Bool
  required: false
  help: Explicitly allow bridge scaling with virtual references and comparable sample composition.
filter_na_consensus_handles:
  type: Bool
  required: false
  help: Remove NaN reporter handles after MAD normalization.
resource_allocation_profile_tag:
  type: String
  required: false
  help: Resource profile in resources.json.
base_resource_update:
  type: ResourceUpdateNamespace
  required: false
  help: Per-process resource adjustments.
  elements:
    memory:
      type: ResourceUpdateList
      required: false
      help: Memory adjustments.
    cpus:
      type: ResourceUpdateList
      required: false
      help: CPU adjustments.
work_dir:
  type: Path
  mode: w
  required: false
  help: Optional Nextflow working directory.
