output_dir:
  type: Path
  mode: w
  required: true
  help: Root output directory.
plex_name:
  type: String
  required: true
  help: Name of the TMT plex used in consensusXML headers and output paths.
idXML:
  type: Path
  mode: r
  required: true
  help: Combined peptide identifications in idXML format.
input_csv:
  type: Path
  mode: r
  required: false
  help: CSV containing mzML paths for one TMT plex.
merged_consensusXML:
  type: Path
  mode: r
  required: false
  help: Existing merged consensusXML used instead of mzML extraction.
channel_description:
  type: Path
  mode: r
  required: false
  help: Reporter channel descriptions for mzML extraction.
protein_quantifier_best_charge_and_fraction:
  type: Bool
  required: false
  help: Report peptide abundance separately by fraction and charge state.
tmt_normalization_method:
  type: String
  required: false
  help: Normalization method, either mad or openms.
mad_normalizer_quasi_intensity:
  type: Bool
  required: false
  help: Write MAD-normalized reference-scaled quasi-intensities instead of log2 ratios.
filter_na_consensus_handles:
  type: Bool
  required: false
  help: Remove NaN reporter handles after MAD normalization.
resource_allocation_profile_tag:
  type: String
  required: false
  help: Resource profile in resources.json.
base_resource_update:
  type: ResourceUpdateNamespace
  required: false
  help: Per-process resource adjustments.
  elements:
    memory:
      type: ResourceUpdateList
      required: false
      help: Memory adjustments.
    cpus:
      type: ResourceUpdateList
      required: false
      help: CPU adjustments.
work_dir:
  type: Path
  mode: w
  required: false
  help: Optional Nextflow working directory.
