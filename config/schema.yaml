output_dir:
  type: Path
  mode: w
  required: true
  help: Root output directory.
dataset_id:
  type: String
  required: true
  help: Dataset identifier used in final filenames; letters, digits, dots, underscores, and hyphens only.
mzML_csv:
  type: Path
  mode: r
  required: false
  help: mzML files for one or more TMT plexes.
channel_csv:
  type: Path
  mode: r
  required: false
  help: Reporter channels and sample descriptions keyed by plex_id for mzML input.
plex_type:
  type: String
  required: false
  help: OpenMS reporter type shared by all plexes in an mzML run.
consensusXML_csv:
  type: Path
  mode: r
  required: false
  help: One premerged consensusXML file per TMT plex.
tmt_workflow:
  type: String
  required: false
  help: Select scan_based (reporter-ion peptide quantification) or feature_based (MS1 feature-based TMT quantification).
FeatureFinderIdentification:
  type: Namespace
  required: false
  help: FeatureFinderIdentification options for the feature-based workflow.
MapAlignerIdentification:
  type: Namespace
  required: false
  help: MapAlignerIdentification options for the feature-based workflow.
FeatureLinkerUnlabeledQT:
  type: Namespace
  required: false
  help: FeatureLinkerUnlabeledQT options for the feature-based workflow.
IsobaricAnalyzer:
  type: Namespace
  required: false
  help: IsobaricAnalyzer options, including extraction and quantification.
FileMerger:
  type: Namespace
  required: false
  help: Optional FileMerger command options; append_method is pipeline-managed.
FileFilter:
  type: Namespace
  required: false
  help: Optional FileFilter command options; sort is pipeline-managed.
IDMapper:
  type: Namespace
  required: false
  help: IDMapper options, including feature and consensus options.
ProteinQuantifier:
  type: Namespace
  required: false
  help: ProteinQuantifier options.
IDConflictResolver:
  type: Namespace
  required: false
  help: IDConflictResolver options.
MADNormalizer:
  type: Namespace
  required: false
  help: MSPtools MADNormalizer options; underscores become CLI hyphens.
fixZeroPlex:
  type: Namespace
  required: false
  help: MSPtools fixZeroPlex options; underscores become CLI hyphens.
consensusXML_entrypoint:
  type: Bool
  required: false
  help: Use consensusXML_csv instead of mzML_csv when true.
idXML_csv:
  type: Path
  mode: r
  required: true
  help: One matching idXML file per plex.
tmt_normalization_method:
  type: String
  required: false
  help: Normalization method, either mad or openms.
filter_na_consensus_handles:
  type: Bool
  required: false
  help: Remove NaN reporter handles after MAD normalization.
resource_allocation_profile_tag:
  type: String
  required: false
  help: Resource profile in resources.json.
base_resource_update:
  type: ResourceUpdateNamespace
  required: false
  help: Per-process resource adjustments.
  elements:
    memory:
      type: ResourceUpdateList
      required: false
      help: Memory adjustments.
    cpus:
      type: ResourceUpdateList
      required: false
      help: CPU adjustments.
work_dir:
  type: Path
  mode: w
  required: false
  help: Optional Nextflow working directory.
